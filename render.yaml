services:
  - type: web
    name: hendydichvumang-aiogram
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MINI_APP_URL
        value: ""
      - key: BOT_HOME_PHOTO
        sync: false
      - key: BOT_MINIGAME_URL
        value: ""
      - key: BOT_GROUP_CHAT_URL
        value: ""
      - key: BOT_SUPPORT_URL
        value: ""
      - key: DATABASE_PATH
        value: database.json
      - key: HOME_PROXY_HUB_API_URL
        value: ""
      - key: HOME_PROXY_HUB_API_TOKEN
        sync: false
      - key: HOME_PROXY_STATUS_PATH
        value: ""
      - key: HOME_PROXY_CREDIT_PATH
        value: ""
      - key: HOME_PROXY_ROUTE_PATH
        value: ""
      - key: HOME_PROXY_AUTH_SCHEME
        value: Bearer
      - key: HOME_PROXY_TIMEOUT_SECONDS
        value: "15"
      - key: LOG_LEVEL
        value: INFO
